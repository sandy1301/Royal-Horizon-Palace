<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <title></title>
</head>
<body>
    <section id="booking">
        <h1>Book Your Stay</h1>
            <form class="booking-form">
                <label for="fullname">Full Name</label>         
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" minlength="8" required><br>
                <label for="email">Email Address</label>         
                <input type="email" id="email" name="email" placeholder="Enter your email" required><br>
                <label for="phone">Phone Number</label>         
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required maxlength="12"><br>
                <label for="checkin">Check-In Date</label>         
                <input type="date" id="checkin" name="checkin" required><br>
                <label for="checkout">Check-Out Date</label>
                <input type="date" id="checkout" name="checkout" required><br>
                <label for="guests">Number of Guests</label>
                <select id="guests" name="guests" required>
                    <option value="">Select Guests</option>
                    <option>1 Guest</option>
                    <option>2 Guests</option>
                    <option>3 Guests</option>
                    <option>4 Guests</option>
                    <option>5+ Guests</option>
                </select><br>
                <label for="room">Room Type</label>
                <select id="room" name="room" required>
                    <option value="">Select Room Type</option>
                    <option>Deluxe Room</option>
                    <option>Executive Room</option>
                    <option>Family Suite</option>
                    <option>Presidential Suite</option>
                </select><br>
                <label for="bed">Bed Preference</label>
                <select id="bed" name="bed">
                    <option value="">Select Bed Type</option>
                    <option>Single Bed</option>
                    <option>Double Bed</option>
                    <option>King Size Bed</option>
                    <option>Twin Beds</option>
                </select><br>
                <label>Payment Method</label><br>
                <input type="radio" id="card" name="payment" value="Card" required>
                <label for="card">Credit/Debit Card</label>
                <input type="radio" id="upi" name="payment" value="UPI">
                <label for="upi">UPI</label>
                <input type="radio" id="cash" name="payment" value="Pay at Hotel">
                <label for="cash">Pay at Hotel</label><br><br>
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the Terms & Conditions</label><br><br>
                <label for="requests">Special Requests</label>
                <textarea id="requests" name="requests" rows="5" placeholder="Any special requests..."></textarea><br><br>
                <div class="button">
                    <button type="submit" class="btn1">Book Now</button>
                    <button type="reset" class="btn2">Reset</button>
                </div>
        </form>
   </section>
   <script src="script.js"></script>
    
   </script>
</body>
</html>
